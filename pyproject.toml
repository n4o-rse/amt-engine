[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amt"
version = "0.3.1"
description = "AMT.engine — Academic Meta Tool reasoning engine (n-ary role chains, six fuzzy logics, SHACL validation)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Florian Thiery" },
    { name = "Allard W. Mees" },
]
license = { text = "MIT" }
dependencies = [
    "rdflib>=7.0",
    "pyshacl>=0.25",
    "pyvis>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "Pillow>=10.1"]
notebook = ["ipython", "ipywidgets"]

[project.scripts]
amt = "amt.cli:main"
amt-runner = "amt.runner:main"

# The ontology stays at the repository root, where ontology/README.md, the
# diagrams and validate_examples.py expect it. package-dir maps that folder
# into the package namespace at build time, so an installed AMT carries it
# as amt/ontology/ instead of claiming a generic top-level "ontology/"
# directory in site-packages. amt._resources resolves both layouts.
[tool.pytest.ini_options]
# pyshacl hashes rdflib Datasets internally, and rdflib 7 warns about the
# deprecated Dataset.identifier / Dataset.default_context on every call: about
# 83 000 identical warnings per test run, none from this package. The two
# filters below silence exactly these; every other warning stays visible.
filterwarnings = [
    "ignore:Dataset.identifier is deprecated:DeprecationWarning",
    "ignore:Dataset.default_context is deprecated:DeprecationWarning",
    "ignore:Dataset.contexts is deprecated:DeprecationWarning",
]

[tool.setuptools]
packages = ["amt", "amt.ontology", "amt.ontology.examples"]

[tool.setuptools.package-dir]
"amt.ontology" = "ontology"
"amt.ontology.examples" = "ontology/examples"

[tool.setuptools.package-data]
"amt.ontology" = ["*.ttl"]
"amt.ontology.examples" = ["*.ttl"]
