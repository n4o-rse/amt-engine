name: CI

# Runs the development pipeline (main.py --strict) on Linux and Windows.
# Warnings count as failures. Commits made by the sync workflow carry
# [skip ci], so they do not start this one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the pipeline
        run: python main.py --strict

      - name: Keep the pipeline report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pipeline-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: build/pipeline_report.txt
          if-no-files-found: ignore
