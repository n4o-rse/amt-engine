<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 980" width="1580" height="980" role="img" aria-label="AMT colour palette" font-family="Roboto, system-ui, -apple-system, Segoe UI, sans-serif">
<rect width="1580" height="980" fill="#f8f7f1"/>
<text x="40" y="62" font-size="34" font-weight="700" fill="#184838">AMT colour palette</text>
<text x="40" y="96" font-size="18" fill="#55625d">Derived from the penguin, the alpaca and the alligator</text>
<text x="40" y="148" font-size="20" font-weight="700" fill="#184838">Green (primary)</text>
<rect x="40" y="164" width="360" height="112" rx="10" fill="#184838" stroke="#000000" stroke-opacity="0.19"/>
<text x="54" y="196" font-size="20" font-weight="700" fill="#ffffff">Deep green</text>
<text x="54" y="226" font-size="18" fill="#ffffff">#184838</text>
