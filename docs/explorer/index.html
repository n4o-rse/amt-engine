<!doctype html>
<html>
  <head>
    <title>AMT Explorer</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <!-- RDF parsing -->
    <script src="https://cdn.jsdelivr.net/npm/n3@1.17.2/browser/n3.min.js"></script>

    <!-- Graph visualisation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.20.0/vis.min.js"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.20.0/vis.min.css"
      rel="stylesheet" />

    <!-- jQuery + jQuery UI -->
    <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <link
      rel="stylesheet"
      href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css" />

    <!-- Materialize -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.100.2/js/materialize.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.100.2/css/materialize.min.css" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet" />

    <!-- AMT scripts (order matters: n3 -> amt -> amt-render -> amt-export) -->
    <script src="../js/amt-reasoner.js"></script>
    <script src="../js/amt.js"></script>
    <script src="../js/amt-render.js"></script>
    <script src="../js/amt-export.js"></script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body { display: flex; flex-direction: column; overflow: hidden; background: #fff; }
      #bar {
        flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        padding: 6px 14px; background: #4f628b; color: #fff; min-height: 52px;
      }
      #bar a.home { color: #fff; font-weight: 600; text-decoration: none; margin-right: 6px; }
      #bar .btn-floating { width: 36px; height: 36px; line-height: 36px; }
      #bar .btn-floating i { line-height: 36px; font-size: 20px; }
      #bar .grow { flex: 1; min-width: 0; }
      #title { font-weight: 600; }
      #status { font-size: 0.9em; margin-left: 10px; }
      .legend { font-size: 0.85em; opacity: 0.9; white-space: nowrap; }
      .legend b { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin: 0 4px 0 8px; }
      #bar img { height: 36px; background: #fff; padding: 2px 4px; border-radius: 2px; }
      #graph { flex: 1; min-height: 0; }
      .modal { max-height: 80% !important; width: 90% !important; }
      @media (max-width: 700px) { .legend, #bar img { display: none; } }
    </style>
  </head>

  <body>
    <div id="bar">
      <a class="home" href="../" title="AMT start page">&larr; AMT</a>
      <span id="title">loading...</span><span id="status"></span>
      <span class="grow"></span>
      <span class="legend"><b style="background:#000"></b>asserted<b style="background:red"></b>inferred</span>
      <a class="btn-floating blue" onclick="openGraphPropModal()" title="choose an example or load a Turtle file"><i class="material-icons">folder_open</i></a>
      <a class="btn-floating red" id="r-but" onclick="toggleReasoning()" title="reasoning on/off"><i class="material-icons">bubble_chart</i></a>
      <a class="btn-floating teal" onclick="exportTTL()" title="download Turtle (including inferred statements)"><i class="material-icons">file_download</i></a>
      <a class="btn-floating purple" onclick="exportCypher()" title="download Cypher for Neo4j"><i class="material-icons">device_hub</i></a>
      <a href="http://academic-meta-tool.xyz" target="_blank" rel="noopener"><img src="../amt_logos.png" alt="Academic Meta Tool, mainzed, i3mainz, LEIZA" /></a>
    </div>
    <div id="graph"></div>

    <!-- Modal: dataset selector -->
    <div id="graphPropModal" class="modal">
      <div class="modal-content">
        <h5>Choose an example</h5>
        <div class="row">
          <div class="input-field col s10">
            <select id="amt-viz"></select>
            <label>Example</label>
          </div>
          <div class="col s2">
            <a class="btn-floating green" onclick="reloadGraphWithProperties()" title="load"><i class="material-icons">check</i></a>
          </div>
        </div>
        <h5>or load your own Turtle file</h5>
        <p>The file stays in your browser, nothing is uploaded. It needs concepts, roles, nodes, weighted statements and axioms in the AMT vocabulary, like the examples.</p>
        <br />
        <input type="file" accept=".ttl,text/turtle" onchange="loadLocalFile(this)" />
      </div>
    </div>

    <!-- Modal: RDF export -->
    <div id="rdfModal" class="modal">
      <div class="modal-content" style="height: 100%; padding: 20px; margin: 0">
        <textarea id="rdf" style="width: 100%; height: 100%; font-family: monospace; font-size: 14px"></textarea>
      </div>
    </div>

    <span id="hiddenclipboard" style="display: none"></span>
  </body>
</html>
